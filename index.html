<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Marble Roulette</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="assets/manifest.json">

  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="구슬을 굴려 당첨자를 뽑는 추첨기">

  <link rel="stylesheet" href="assets/style.scss" />
</head>
<body>
<script type="module" src="./src/index.ts"></script>
<script type="text/javascript">
  function getNames() {
    const value = document.querySelector('#in_names').value.trim();
    return value.split(/[,\r\n]/g).map(v => v.trim()).filter(v => !!v);
  }

  function parseName(nameStr) {
    const weightRegex = /(\/\d+)/;
    const countRegex = /(\*\d+)/;
    const hasWeight = weightRegex.test(nameStr);
    const hasCount = countRegex.test(nameStr);
    const name = /^\s*([^\/*]+)?/.exec(nameStr)[1];
    const weight = hasWeight ? parseInt(weightRegex.exec(nameStr)[1].replace('/', '')) : 1;
    const count = hasCount ? parseInt(countRegex.exec(nameStr)[1].replace('*', '')) : 1;
    return {
      name,
      weight,
      count,
    };
  }

  function getReady() {
    const names = getNames();
    window.roulette.setMarbles(names);
    ready = names.length > 0;
    localStorage.setItem('mbr_names', names.join(','));
    updateWinnerUI();
  }

  function updateWinnerUI() {
    const total = window.roulette ? window.roulette.getCount() : 0;
    const rankInput = document.querySelector('#in_winningRank');
    let rankVal = parseInt(rankInput.value, 10);
    if (isNaN(rankVal) || rankVal < 1) {
      rankVal = 1;
    }

    const btnFirst = document.querySelector('.btn-first-winner');
    const btnLast = document.querySelector('.btn-last-winner');
    const btnFirstToN = document.querySelector('.btn-first-to-n-winner');
    const btnNToLast = document.querySelector('.btn-n-to-last-winner');

    if (btnFirst) btnFirst.classList.toggle('active', winnerType === 'first');
    if (btnLast) btnLast.classList.toggle('active', winnerType === 'last');
    if (btnFirstToN) btnFirstToN.classList.toggle('active', winnerType === 'firstToN');
    if (btnNToLast) btnNToLast.classList.toggle('active', winnerType === 'nToLast');

    const showInput = winnerType === 'firstToN' || winnerType === 'nToLast' || winnerType === 'custom';
    rankInput.classList.toggle('active', showInput);

    let start = 0;
    let end = 0;

    if (winnerType === 'first') {
      start = 0;
      end = 0;
      rankInput.value = 1;
    } else if (winnerType === 'last') {
      start = Math.max(0, total - 1);
      end = Math.max(0, total - 1);
      rankInput.value = total || 1;
    } else if (winnerType === 'firstToN') {
      const n = Math.max(1, Math.min(total || 1, rankVal));
      rankInput.value = n;
      start = 0;
      end = n - 1;
    } else if (winnerType === 'nToLast') {
      const n = Math.max(1, Math.min(total || 1, rankVal));
      rankInput.value = n;
      start = n - 1;
      end = Math.max(0, total - 1);
    } else if (winnerType === 'custom') {
      const n = Math.max(1, Math.min(total || 1, rankVal));
      rankInput.value = n;
      start = n - 1;
      end = n - 1;
    }

    if (window.options) {
      window.options.winnerType = winnerType;
      window.options.winnerRankStart = start;
      window.options.winnerRankEnd = end;
      window.options.winningRank = end;
    }
    if (window.roulette && window.roulette.setWinningCondition) {
      window.roulette.setWinningCondition(winnerType, start, end);
    }

    const infoElem = document.querySelector('#winnerInfo');
    if (infoElem) {
      const count = Math.max(0, end - start + 1);
      const isKo = document.documentElement.lang === 'ko';
      if (winnerType === 'first') {
        infoElem.textContent = isKo ? '(1등)' : '(#1)';
      } else if (winnerType === 'last') {
        infoElem.textContent = isKo ? `(${total}등 / 꼴등)` : `(#${total} / Last)`;
      } else if (winnerType === 'firstToN') {
        infoElem.textContent = isKo ? `(1 ~ ${end + 1}등 / ${count}명)` : `(#1 ~ #${end + 1} / ${count})`;
      } else if (winnerType === 'nToLast') {
        infoElem.textContent = isKo ? `(${start + 1} ~ ${total}등 / ${count}명)` : `(#${start + 1} ~ #${total} / ${count})`;
      } else {
        infoElem.textContent = isKo ? `(${start + 1}등)` : `(#${start + 1})`;
      }
    }
  }

  function setWinnerRank(rank) {
    document.querySelector('#in_winningRank').value = rank;
    updateWinnerUI();
  }

  let ready = false;
  let winnerType = 'first';

  document.addEventListener('DOMContentLoaded', () => {
    initialize();
  });

  function initialize() {
    if (!window.roulette || !window.roulette.isReady) {
      setTimeout(initialize, 100);
      return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const namesFromUrl = urlParams.get('names');

    if (namesFromUrl) {
      document.querySelector('#in_names').value = namesFromUrl.replace(/,/g, '\n');
    } else {
      const savedNames = localStorage.getItem('mbr_names');
      if (savedNames) {
        document.querySelector('#in_names').value = savedNames;
      }
    }
    document.querySelector('#in_names').addEventListener('input', () => {
      getReady();
    });

    document.querySelector('#in_names').addEventListener('blur', () => {
      const nameSource = getNames();
      const nameSet = new Set();
      const nameCounts = {};
      nameSource.forEach(nameSrc => {
        const name = parseName(nameSrc);
        const key = name.weight > 1 ? `${name.name}/${name.weight}` : name.name;
        if (!nameSet.has(key)) {
          nameSet.add(key);
          nameCounts[key] = 0;
        }
        nameCounts[key] += name.count;
      });
      const result = [];
      Object.keys(nameCounts).forEach(key => {
        if (nameCounts[key] > 1) {
          result.push(`${key}*${nameCounts[key]}`);
        } else {
          result.push(key);
        }
      });

      const oldValue = document.querySelector('#in_names').value;
      const newValue = result.join(',');

      if (oldValue !== newValue) {
        document.querySelector('#in_names').value = newValue;
        getReady();
      }
    });

    document.querySelector('#btnShuffle').addEventListener('click', () => {
      getReady();
    });

    document.querySelector('#btnStart').addEventListener('click', () => {
      if (!ready) return;
      document.querySelector('#settings').classList.add('hide');
      window.roulette.start();
    });

    document.querySelector('#chkAutoRecording').addEventListener('change', (e) => {
      window.options.autoRecording = e.target.matches(':checked');
      window.roulette.setAutoRecording(window.options.autoRecording);
    });

    document.querySelector('#chkSkill').addEventListener('change', (e) => {
      window.options.useSkills = e.target.matches(':checked');
      window.roulette.setWinningRank(window.options.winningRank);
    });

    document.querySelector('#chkDarkMode').addEventListener('change', (e) => {
      window.options.darkMode = e.target.matches(':checked');
      window.roulette.setTheme(window.options.darkMode ? 'dark' : 'light');
      document.documentElement.classList.toggle('light', !window.options.darkMode);
    });

    document.querySelector('#in_winningRank').addEventListener('input', () => {
      updateWinnerUI();
    });

    document.querySelector('#in_winningRank').addEventListener('change', () => {
      updateWinnerUI();
    });

    document.querySelector('.btn-last-winner').addEventListener('click', () => {
      winnerType = 'last';
      updateWinnerUI();
    });
    document.querySelector('.btn-first-winner').addEventListener('click', () => {
      winnerType = 'first';
      updateWinnerUI();
    });
    document.querySelector('.btn-first-to-n-winner').addEventListener('click', () => {
      const total = window.roulette ? window.roulette.getCount() : 0;
      winnerType = 'firstToN';
      const rankInput = document.querySelector('#in_winningRank');
      const cur = parseInt(rankInput.value, 10);
      if (isNaN(cur) || cur <= 1 || cur >= total) {
        rankInput.value = Math.min(3, Math.max(1, total));
      }
      updateWinnerUI();
    });
    document.querySelector('.btn-n-to-last-winner').addEventListener('click', () => {
      const total = window.roulette ? window.roulette.getCount() : 0;
      winnerType = 'nToLast';
      const rankInput = document.querySelector('#in_winningRank');
      const cur = parseInt(rankInput.value, 10);
      if (isNaN(cur) || cur <= 1 || cur >= total) {
        rankInput.value = Math.max(1, total - 2);
      }
      updateWinnerUI();
    });

    window.roulette.addEventListener('goal', () => {
      ready = false;
      setTimeout(() => {
        document.querySelector('#settings').classList.remove('hide');
      }, 3000);
    });

    window.roulette.addEventListener('message', (e) => {
      simpleToast(e.detail);
    });

    const toggleBtn = document.querySelector('#btnToggleSettings');
    const collapsible = document.querySelector('.collapsible-rows');
    toggleBtn.addEventListener('click', () => {
      collapsible.classList.toggle('collapsed');
      toggleBtn.querySelector('.toggle-arrow').textContent =
        collapsible.classList.contains('collapsed') ? '▲' : '▼';
    });

    document.querySelector('#btnShuffle').click();

    const maps = window.roulette.getMaps();
    const mapSelector = document.querySelector('#sltMap');
    maps.forEach((map) => {
      const option = document.createElement('option');
      option.value = map.index;
      option.innerHTML = map.title;
      option.setAttribute('data-trans', '');
      window.translateElement(option);
      mapSelector.append(option);
    });
    mapSelector.addEventListener('change', (e) => {
      const index = e.target.value;
      window.roulette.setMap(index);
    });

    function simpleToast(msg) {
      const toast = document.createElement('div');
      toast.classList.add('toast');
      toast.innerHTML = msg;

      if (window.translateElement) {
        window.translateElement(toast);
      }

      document.body.appendChild(toast);
      setTimeout(() => {
        document.body.removeChild(toast);
      }, 1200);
    }
  }
</script>
<h1 class="sr-only">Marble Roulette - 랜덤 추첨기</h1>
<div id="settings" class="settings">
  <div class="right">
    <button id="btnToggleSettings" class="btn-toggle-settings">
      <span data-trans>Settings</span>
      <i class="toggle-arrow">▲</i>
    </button>
    <div class="collapsible-rows collapsed">
      <div class="row">
        <label for='sltMap'>
          <i class="icon map"></i>
          <span data-trans>Map</span>
        </label>
        <select id="sltMap"></select>
      </div>
      <div class="row row-toggles">
        <div class='toggle-item'>
          <label for='chkAutoRecording'>
            <i class="icon record"></i>
            <span data-trans>Recording</span>
          </label>
          <input type="checkbox" id="chkAutoRecording" />
        </div>
        <div class='toggle-item'>
          <label for='chkSkill'>
            <i class="icon bomb"></i>
            <span data-trans>Using skills</span>
          </label>
          <input type="checkbox" id="chkSkill" checked />
        </div>
      </div>
      <div class="row row-winner">
        <label>
          <i class="icon trophy"></i>
          <span data-trans>The winner is</span>
        </label>
        <div class="btn-group">
          <button type="button" class="btn-winner btn-first-winner active" data-trans>First</button>
          <button type="button" class="btn-winner btn-last-winner" data-trans>Last</button>
          <button type="button" class="btn-winner btn-first-to-n-winner" data-trans>First to Nth</button>
          <button type="button" class="btn-winner btn-n-to-last-winner" data-trans>Nth to Last</button>
          <input type="number" id="in_winningRank" value="1" min="1" />
          <span class="winner-info" id="winnerInfo"></span>
        </div>
      </div>
      <div class="row row-theme">
        <div class='theme'>
          <i class='icon sun'></i>
          <input type='checkbox' id='chkDarkMode' checked />
          <i class='icon moon'></i>
        </div>
      </div>
    </div>
  </div>
  <div class="left">
    <h3 data-trans>Enter names below</h3>
    <textarea id="in_names" placeholder="Input names separated by commas or line feed here" data-trans="placeholder">수박*2,키위*2,귤*2</textarea>
    <div class="actions">
      <button id="btnShuffle">
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id="btnStart">
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>
<div class="copyright">&copy; 2022-2026. <a href="https://github.com/lazygyu/roulette" target="_blank" rel="noopener">lazygyu</a></div>
</body>
</html>
